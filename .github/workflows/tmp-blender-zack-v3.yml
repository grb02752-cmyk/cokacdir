name: temp blender zack v3 render
on:
  push:
    branches:
      - tmp/blender-zack-v3-20260928
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libgl1 libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libxcb1
      - name: Download Blender 5.2.2
        run: |
          curl -L --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
      - name: Render 150 native frames
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p render_out
          xvfb-run -a ./blender-5.2.2-linux-x64/blender -b -P tmp/blender_zack_v3.py
      - name: Encode H264
        run: |
          ffmpeg -y -framerate 30 -i render_out/frames/frame_%04d.png -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -movflags +faststart render_out/zack_stapler_v3_5s_30fps.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,duration,codec_name -of default=nw=1 render_out/zack_stapler_v3_5s_30fps.mp4
          cp render_out/frames/frame_0020.png render_out/preview_0020.png
          cp render_out/frames/frame_0068.png render_out/preview_0068.png
          cp render_out/frames/frame_0128.png render_out/preview_0128.png
      - uses: actions/upload-artifact@v4
        with:
          name: zack-stapler-v3-render
          path: |
            render_out/zack_stapler_v3_5s_30fps.mp4
            render_out/zack_stapler_v3.blend
            render_out/preview_0020.png
            render_out/preview_0068.png
            render_out/preview_0128.png
          retention-days: 3
          compression-level: 0
