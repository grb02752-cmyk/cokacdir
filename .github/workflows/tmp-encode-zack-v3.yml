name: temp encode zack v3 existing frames
on:
  push:
    branches:
      - tmp/blender-zack-v3-20260928
permissions:
  contents: read
  actions: read
jobs:
  encode:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: frames
          merge-multiple: true
          run-id: 36495418695
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: zack-stapler-v3-blend
          path: blend
          run-id: 36495418695
          github-token: ${{ github.token }}
      - name: Verify and encode
        run: |
          COUNT="$(find frames -maxdepth 1 -name 'frame_*.png' | wc -l)"
          echo "FRAME_COUNT=$COUNT"
          test "$COUNT" -eq 150
          ffmpeg -y -framerate 30 -i frames/frame_%04d.png -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -movflags +faststart zack_stapler_v3_5s_30fps.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,duration,codec_name,nb_frames -of default=nw=1 zack_stapler_v3_5s_30fps.mp4
          cp frames/frame_0020.png preview_0020.png
          cp frames/frame_0068.png preview_0068.png
          cp frames/frame_0128.png preview_0128.png
          cp blend/zack_stapler_v3.blend zack_stapler_v3.blend
      - uses: actions/upload-artifact@v4
        with:
          name: zack-stapler-v3-final
          path: |
            zack_stapler_v3_5s_30fps.mp4
            zack_stapler_v3.blend
            preview_0020.png
            preview_0068.png
            preview_0128.png
          retention-days: 3
          compression-level: 0
